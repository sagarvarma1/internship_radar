[project]
name = "internship-radar"
version = "0.1.0"
description = "Watches public ATS job boards for new internships and alerts you"
readme = "README.md"
authors = [
    { name = "Sagar Varma", email = "sagarvarmafhs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
radar = "internship_radar.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]
