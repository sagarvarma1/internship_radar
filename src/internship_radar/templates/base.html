<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Internship Radar{% endblock %}</title>
<meta name="description" content="Every new tech internship, the minute it's posted. Free email alerts matched to what you're eligible for.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%234f46e5' stroke-width='3' opacity='.35'/><circle cx='16' cy='16' r='7' fill='none' stroke='%234f46e5' stroke-width='3'/><circle cx='16' cy='16' r='2.5' fill='%234f46e5'/></svg>">
<style>
:root {
  --bg: #fafafa; --panel: #ffffff; --text: #18181b; --muted: #71717a; --faint: #a1a1aa;
  --line: #e4e4e7; --hover: #f4f4f5; --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff;
  --good: #16a34a; --good-soft: #f0fdf4; --warn: #b45309; --warn-soft: #fffbeb; --bad: #dc2626;
  --bad-soft: #fef2f2; --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0b0e; --panel: #141418; --text: #f4f4f5; --muted: #a1a1aa; --faint: #71717a;
    --line: #26262c; --hover: #1c1c22; --accent: #818cf8; --accent-hover: #a5b4fc; --accent-soft: #1e1b4b;
    --good: #4ade80; --good-soft: #052e16; --warn: #fbbf24; --warn-soft: #2a1d05; --bad: #f87171;
    --bad-soft: #2a0a0a; --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, ui-sans-serif,
  -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; height: 56px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; color: var(--text); letter-spacing: -.01em; }
.brand:hover { color: var(--text); }
.brand svg { width: 22px; height: 22px; }
.nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.nav a, .nav button.link { color: var(--muted); font-size: 14px; padding: 6px 10px; border-radius: 8px;
  font-weight: 500; background: none; border: 0; cursor: pointer; font-family: inherit; }
.nav a:hover, .nav button.link:hover { color: var(--text); background: var(--hover); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit;
  font-size: 14px; font-weight: 600; border-radius: 10px; padding: 9px 16px; border: 1px solid transparent;
  cursor: pointer; background: var(--accent); color: #fff; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--accent-hover); color: #fff; }
.btn.ghost { background: var(--panel); color: var(--text); border-color: var(--line); }
.btn.ghost:hover { background: var(--hover); }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.nav a.btn { color: #fff; background: var(--accent); padding: 7px 14px; margin-left: 4px; }
.nav a.btn:hover { background: var(--accent-hover); color: #fff; }
input[type=email], input[type=text], input[type=search], input[type=number], input[type=month], select {
  font: inherit; font-size: 15px; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
main { padding: 28px 0 80px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.notice { padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--text); font-size: 14px;
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.notice.good { background: var(--good-soft); }
.notice.bad { background: var(--bad-soft); }
footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--faint); font-size: 13px; }
footer a { color: var(--muted); }
.live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); animation: pulse 2s infinite; vertical-align: 1px; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .live { animation: none; } }
{% block style %}{% endblock %}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--accent)" stroke-width="3" opacity=".3"/><circle cx="16" cy="16" r="7" fill="none" stroke="var(--accent)" stroke-width="3"/><circle cx="16" cy="16" r="2.5" fill="var(--accent)"/></svg>Internship Radar</a>
  <nav class="nav">
    <a href="/companies">Companies</a>
    {% if user %}
      <a href="/settings">Settings</a>
      <form method="post" action="/logout" style="margin:0"><button class="link" type="submit">Sign out</button></form>
    {% else %}
      <a class="btn" href="/login">Sign in</a>
    {% endif %}
  </nav>
</div></header>
<main class="wrap">{% block body %}{% endblock %}</main>
<footer><div class="wrap">Postings come straight from companies' public job boards (Ashby, Greenhouse, Lever and Workday), and boards with internships open are checked every minute. <a href="/companies">Which companies?</a></div></footer>
</body>
</html>
