<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Internship Radar{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%232563eb' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%232563eb'/></svg>">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #e4e3df;
  --accent: #2563eb; --accent-soft: #e8efff; --good: #15803d; --good-soft: #e3f4e8;
  --warn: #b45309; --warn-soft: #fdf0dc; --bad: #b91c1c; --bad-soft: #fde5e5; --new: #7c3aed;
  --new-soft: #f0e9ff; --radius: 8px;
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --panel: #1d1d1b; --text: #ecebe6; --muted: #9b9a94; --line: #2f2f2c;
    --accent: #7aa2ff; --accent-soft: #1d2a47; --good: #6ad08f; --good-soft: #17301f;
    --warn: #f0b264; --warn-soft: #382817; --bad: #ff8a8a; --bad-soft: #3a1a1a; --new: #b69cff;
    --new-soft: #2a2140;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { background: var(--panel); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: center; gap: 20px; height: 54px; }
.brand { font-weight: 650; font-size: 15px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.brand svg { width: 20px; height: 20px; }
nav a { color: var(--muted); margin-right: 14px; font-weight: 500; }
nav a.on { color: var(--text); }
.meta { margin-left: auto; color: var(--muted); font-size: 12.5px; text-align: right; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11.5px; font-weight: 550;
        background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.new { background: var(--new-soft); color: var(--new); }
.pill.mute { background: transparent; border: 1px solid var(--line); color: var(--muted); }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--radius); overflow: hidden; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel); }
tr:last-child td { border-bottom: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
main { padding: 18px 0 60px; }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 15px; margin: 28px 0 10px; font-weight: 650; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0 18px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 10px 14px; min-width: 130px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.scroll { overflow-x: auto; }
</style>
</head>
<body>
<header><div class="wrap top">
  <a class="brand" href="/"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3" opacity=".35"/><circle cx="16" cy="16" r="7" fill="none" stroke="var(--accent)" stroke-width="3"/><circle cx="16" cy="16" r="2.5" fill="var(--accent)"/></svg>Internship Radar</a>
  <nav>{% block nav %}{% endblock %}</nav>
  <div class="meta">{% block meta %}{% endblock %}</div>
</div></header>
<main class="wrap">{% block body %}{% endblock %}</main>
</body>
</html>
