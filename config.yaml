# Internship Radar site configuration. Secrets (email provider keys) come from env vars; see README.
# Each user's eligibility profile, filters and email preferences live in the database and are
# edited on the site's Settings page. `filters` below are the defaults for new users and visitors.

site_url: http://localhost:8000   # overridden by RADAR_SITE_URL in production

filters:
  role_types: [swe, ml, research, applied_science]   # also: data, hardware
  countries: [US]
  allow_remote: true
  allow_unknown_location: true
  preferred_cities: []
  preferred_tags: [target, ai-lab]
  min_score: 0

alerts:
  batch_threshold: 3   # more than 3 matches in the same minute -> one combined email

poll:
  interval_minutes: 1
  concurrency: 32
  per_host_interval_seconds: 0.2
  max_backoff_hours: 6
  deadline_seconds: 45
